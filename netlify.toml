# Netlify Configuration for Sake Bar Natur
# "Best viewed in Netscape Navigator 4.0 at 800x600"

[build]
  # Since this is a static site, we just publish the src folder
  publish = "src"
  command = "echo 'No build step needed - static site'"

[[redirects]]
  # Redirect all 404s to index.html for SPA behavior (if needed)
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  # Local dev server settings
  port = 3000
  autoLaunch = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"